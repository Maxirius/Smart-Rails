plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    // Offline/mirrored setups: either pass -PsrMirror=/path/to/maven-repo or
    // drop a maven-layout tree into libs-local/ next to this build script.
    // Needed because some mirrors reject the raw '+' in the artifact
    // coordinate (e.g. fabric-api 0.162.0+26.3).
    def mirrorDir = project.hasProperty("srMirror")
            ? file(project.srMirror)
            : file("libs-local")
    if (mirrorDir.isDirectory()) {
        maven { url = mirrorDir }
    }
}

// Minecraft 26.1+ ships unobfuscated: no mappings block, no remapping.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc:fabric-api:${project.fabric_version}"

    // JDBC driver shaded into the mod jar (precedent: MCStats-to-SQL)
    include implementation("org.mariadb.jdbc:mariadb-java-client:3.5.1")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
